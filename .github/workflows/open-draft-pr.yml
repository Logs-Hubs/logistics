
name: Open Draft PR for Linear

on:
  push:
    branches:
      - 'codex/**'
      - 'LOG-*'
      - 'log-*'
      - '**/LOG-*'
      - '**/log-*'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: draft-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open-draft-pr:
    name: Create Draft Pull Request
    runs-on: ubuntu-latest

    steps:
      - name: Create Draft PR if missing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PR_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Missing GH_PR_TOKEN secret"
            exit 1
          fi

          # Extract Linear ID from branch or last commit.
          ISSUE_ID="$(
            printf '%s\n%s\n' "$BRANCH" "$COMMIT_MESSAGE" |
              grep -Eio '(LOG)-[0-9]+' |
              head -n 1 |
              tr '[:lower:]' '[:upper:]' || true
          )"

          if [ -z "$ISSUE_ID" ]; then
            echo "No Linear issue ID found. Skipping."
            exit 0
          fi

          echo "Linear issue: $ISSUE_ID"

          # Prevent duplicate PRs for the same branch.
          EXISTING="$(
            gh pr list \
              --repo "$REPO" \
              --head "$BRANCH" \
              --state all \
              --limit 100 \
              --json url \
              --jq '.[0].url // empty'
          )"

          if [ -n "$EXISTING" ]; then
            echo "PR already exists: $EXISTING"
            exit 0
          fi

          TITLE="$ISSUE_ID: Codex implementation"

          BODY="$(cat <<EOF
          ## Summary

          Implementation for Linear issue $ISSUE_ID.

          ## Linear issue

          Fixes $ISSUE_ID

          ## Validation

          - [ ] Check implementation
          - [ ] Verify automated tests
          - [ ] Review acceptance criteria

          ## Git information

          Source branch: \`$BRANCH\`
          Target branch: \`main\`

          ## Review

          Automatically created as Draft.

          Do not merge without human review.
          EOF
          )"

          PR_URL="$(
            gh pr create \
              --repo "$REPO" \
              --base main \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body "$BODY" \
              --draft
          )"

          echo "Draft PR created: $PR_URL"
